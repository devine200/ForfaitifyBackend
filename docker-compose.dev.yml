# Optional override for local iteration (bind-mount source + uvicorn --reload).
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    command:
      [
        "uvicorn",
        "ForfaitifyApiCore.asgi:application",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - .:/app
      - media_data:/app/media

  worker:
    volumes:
      - .:/app
      - media_data:/app/media
